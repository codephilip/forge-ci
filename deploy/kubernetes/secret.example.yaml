# Create it from the command line (keeps tokens out of files):
#
#   kubectl create namespace forge
#   kubectl -n forge create secret generic forge-secrets \
#     --from-literal=GITHUB_TOKEN=ghp_... \
#     --from-literal=FORGE_REPOS=owner/repo,owner/other \
#     --from-literal=ANTHROPIC_API_KEY=sk-ant-...      # optional
#
# or fill this in and `kubectl apply -f` it — but don't commit it.
apiVersion: v1
kind: Secret
metadata:
  name: forge-secrets
  namespace: forge
type: Opaque
stringData:
  GITHUB_TOKEN: ""
  FORGE_REPOS: "owner/repo"
  # FORGE_ORGS: "my-org"
  # ANTHROPIC_API_KEY: ""
  # NOTIFY_TO: "you@example.com"
  # NOTIFY_FROM: "Forge CI <ci@example.com>"
  # RESEND_API_KEY: ""
